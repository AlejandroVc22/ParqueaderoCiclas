services:
  # =========================================
  # PostgreSQL - BD del Auth (Spring Boot)
  # =========================================
  postgres:
    image: postgres:16-alpine
    container_name: cp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auth_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-auth_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # =========================================
  # MySQL - BD del Parqueadero (Spring Boot)
  # =========================================
  mysql:
    image: mysql:8.0
    container_name: cp_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-parqueadero_db}
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - cp_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 15

  # =========================================
  # Microservicio Auth (Spring Boot 3 + Postgres)
  # =========================================
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: cp_auth_service
    restart: unless-stopped
    environment:
      PORT: 4001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-auth_db}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-ciclo-parqueadero-super-secret-key-change-in-production-please}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@cicloparqueadero.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cp_network

  # =========================================
  # Microservicio Parqueadero (Spring Boot 3 + MySQL)
  # =========================================
  parqueadero-service:
    build:
      context: ./parqueadero-service
      dockerfile: Dockerfile
    container_name: cp_parqueadero_service
    restart: unless-stopped
    environment:
      PORT: 4002
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-parqueadero_db}
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-ciclo-parqueadero-super-secret-key-change-in-production-please}
    ports:
      - "4002:4002"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cp_network

  # =========================================
  # Frontend (Spring Boot + Thymeleaf)
  # =========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cp_frontend
    restart: unless-stopped
    environment:
      PORT: 8080
      AUTH_API_URL: http://auth-service:4001
      PARQUEADERO_API_URL: http://parqueadero-service:4002
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - parqueadero-service
    networks:
      - cp_network

networks:
  cp_network:
    driver: bridge

volumes:
  postgres_data:
  mysql_data:
