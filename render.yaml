# =====================================================================
# Render Blueprint - Ciclo-Parqueadero (Spring Boot)
# =====================================================================
# Crea automáticamente:
#   - PostgreSQL          (cp-postgres)
#   - auth-service        (Spring Boot 3 + Java 17)
#   - parqueadero-service (Spring Boot 3 + Java 17)
#   - frontend            (Spring Boot 3 + Thymeleaf)
#
# IMPORTANTE: Render NO ofrece MySQL.
# Aprovisiona MySQL aparte (Railway / Aiven / Clever Cloud) y rellena
# las variables marcadas con `sync: false` en el dashboard de Render.
# =====================================================================

databases:
  - name: cp-postgres
    plan: free
    databaseName: auth_db
    user: cp_admin
    region: oregon

services:
  # ---------------------------------------------------------------
  # Auth-service (Spring Boot + Postgres)
  # ---------------------------------------------------------------
  - type: web
    name: cp-auth-service
    runtime: docker
    plan: free
    region: oregon
    rootDir: auth-service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 4001
      - key: DB_HOST
        fromDatabase: { name: cp-postgres, property: host }
      - key: DB_PORT
        fromDatabase: { name: cp-postgres, property: port }
      - key: DB_NAME
        fromDatabase: { name: cp-postgres, property: database }
      - key: DB_USER
        fromDatabase: { name: cp-postgres, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: cp-postgres, property: password }
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000
      - key: ADMIN_NAME
        value: Administrador
      - key: ADMIN_EMAIL
        value: admin@cicloparqueadero.com
      - key: ADMIN_PASSWORD
        value: Admin123!

  # ---------------------------------------------------------------
  # Parqueadero-service (Spring Boot + MySQL externo)
  # ---------------------------------------------------------------
  - type: web
    name: cp-parqueadero-service
    runtime: docker
    plan: free
    region: oregon
    rootDir: parqueadero-service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 4002
      # Datos del MySQL externo (Railway / Aiven / Clever Cloud)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Mismo JWT_SECRET que auth-service
      - key: JWT_SECRET
        fromService:
          name: cp-auth-service
          type: web
          envVarKey: JWT_SECRET

  # ---------------------------------------------------------------
  # Frontend (Spring Boot + Thymeleaf)
  # ---------------------------------------------------------------
  - type: web
    name: cp-frontend
    runtime: docker
    plan: free
    region: oregon
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      # Después de "Apply", pega las URLs públicas de los backends.
      - key: AUTH_API_URL
        sync: false
      - key: PARQUEADERO_API_URL
        sync: false
